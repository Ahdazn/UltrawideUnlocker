plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ultrawideunlock'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ultrawideunlock"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Hanya untuk compile; kelas asli disediakan oleh LSPosed saat runtime.
    compileOnly project(':xposed-stub')
}
